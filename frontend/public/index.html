<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- ═══════════════════════════════════════════════════════════
         PRIMARY SEO META TAGS
    ═══════════════════════════════════════════════════════════ -->
    <title>DEVtrace — Developer Productivity & GGSIPU Placement Dashboard</title>
    <meta name="description" content="DEVtrace is the all-in-one developer productivity dashboard built for GGSIPU engineers. Track DSA progress (79 problems, 23 days), manage tasks, notes & goals, test APIs, and access real campus placement interview experiences from USICT, MAIT, MSIT, BVCOE, BPIT and more." />
    <meta name="keywords" content="DEVtrace, GGSIPU placements, IPU placement hub, DSA tracker, developer dashboard, GGSIPU interview experiences, USICT placements, MAIT placements, MSIT placements, BVCOE placements, BPIT placements, Indus Valley Partners, Nagarro, Impressico, Pomodoro timer, code snippets, API tester, GitHub profile, developer productivity, campus placement prep, task manager, notes app" />
    <meta name="author" content="DEVtrace" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#0B0F1A" />
    <meta name="color-scheme" content="dark" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://devtracedash.netlify.app/" />

    <!-- ═══════════════════════════════════════════════════════════
         OPEN GRAPH (Facebook / LinkedIn / WhatsApp)
    ═══════════════════════════════════════════════════════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://devtracedash.netlify.app/" />
    <meta property="og:site_name" content="DEVtrace" />
    <meta property="og:title" content="DEVtrace — Developer Productivity & GGSIPU Placement Dashboard" />
    <meta property="og:description" content="Track your DSA streak, manage tasks & goals, test APIs, and access 100+ real GGSIPU campus placement interview experiences — all in one dark-neon developer dashboard. Built for IPU engineers." />
    <meta property="og:image" content="https://devtracedash.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DEVtrace — Developer Productivity and GGSIPU Placement Dashboard" />
    <meta property="og:locale" content="en_IN" />

    <!-- ═══════════════════════════════════════════════════════════
         TWITTER CARD (X.com)
    ═══════════════════════════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@devtrace" />
    <meta name="twitter:creator" content="@devtrace" />
    <meta name="twitter:title" content="DEVtrace — GGSIPU Developer Dashboard & Placement Hub" />
    <meta name="twitter:description" content="79 DSA problems, real GGSIPU campus interview experiences, Pomodoro timer, API tester & GitHub analytics — your all-in-one developer productivity hub." />
    <meta name="twitter:image" content="https://devtracedash.netlify.app/og-image.png" />
    <meta name="twitter:image:alt" content="DEVtrace Dashboard Preview" />

    <!-- ═══════════════════════════════════════════════════════════
         ICONS & MANIFEST
    ═══════════════════════════════════════════════════════════ -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ═══════════════════════════════════════════════════════════
         PRECONNECT / DNS PREFETCH RESOURCE HINTS
    ═══════════════════════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://devtrace-backend.onrender.com" />
    <link rel="dns-prefetch" href="https://api.github.com" />

    <!-- Google Fonts: Sora (Display) + JetBrains Mono (Code) -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- ═══════════════════════════════════════════════════════════
         JSON-LD STRUCTURED DATA (SoftwareApplication)
    ═══════════════════════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "DEVtrace",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web",
      "url": "https://devtracedash.netlify.app",
      "description": "DEVtrace is a full-stack developer productivity dashboard built for GGSIPU engineering students. It includes a DSA tracker (79 problems, 23 days), task/notes/goals workspace, Pomodoro timer, API proxy tester, GitHub OAuth analytics, code snippets vault, and a GGSIPU campus placement hub covering real interview experiences from companies like Indus Valley Partners, Nagarro, Impressico, Josh Technology, and more.",
      "screenshot": "https://devtracedash.netlify.app/og-image.png",
      "featureList": [
        "79-Problem DSA Curriculum (23 Days)",
        "Unified Tasks, Notes & Goals Workspace",
        "Pomodoro Focus Timer with Browser Notifications",
        "Server-side API Proxy Tester with JSONB History",
        "GitHub OAuth Profile — Contribution Heatmap, Streaks, Repos",
        "GGSIPU Campus Placement Hub — Company Directory, Interview Experiences, Question Bank",
        "Code Snippets Vault with Syntax Highlighting",
        "Daily Streak Tracking"
      ],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      },
      "author": {
        "@type": "Person",
        "name": "Nitin"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "ratingCount": "50"
      }
    }
    </script>

    <!-- JSON-LD: WebSite (enables Google Sitelinks Search Box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "DEVtrace",
      "url": "https://devtracedash.netlify.app",
      "description": "All-in-one developer productivity dashboard and GGSIPU campus placement prep hub.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://devtracedash.netlify.app/placements?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD: EducationalOrganization context (GGSIPU) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "DEVtrace GGSIPU Placement Hub",
      "url": "https://devtracedash.netlify.app/placements",
      "description": "Real campus placement interview experiences, question banks, company-wise topic trends, and prep roadmaps for students of GGSIPU affiliated colleges — USICT, MAIT, MSIT, BVCOE, BPIT, ADGITM, GTBIT, VIPS and more.",
      "audience": {
        "@type": "Audience",
        "audienceType": "Engineering Students",
        "geographicArea": {
          "@type": "AdministrativeArea",
          "name": "Guru Gobind Singh Indraprastha University, Delhi"
        }
      },
      "about": {
        "@type": "EducationalOrganization",
        "name": "Guru Gobind Singh Indraprastha University (GGSIPU)",
        "url": "http://www.ipu.ac.in",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Delhi",
          "addressCountry": "IN"
        }
      }
    }
    </script>

  </head>
  <body>
    <noscript>
      <style>
        body { background: #0B0F1A; color: #e2e8f0; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 2rem; }
      </style>
      <div>
        <h1>DEVtrace — Developer Productivity & GGSIPU Placement Dashboard</h1>
        <p>Please enable JavaScript to run DEVtrace. It is a full-stack React application for developer productivity and GGSIPU campus placement preparation.</p>
        <a href="https://devtracedash.netlify.app">devtracedash.netlify.app</a>
      </div>
    </noscript>
    <div id="root"></div>
  </body>
</html>
